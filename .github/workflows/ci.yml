name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv has published only immutable full-version tags since v8: there is no @v10.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12" # the floor of requires-python in pyproject.toml
      - run: make install
      - run: make check # ruff + pytest; offline, no API key
